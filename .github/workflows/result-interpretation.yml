name: Validate and publish result interpretation

on:
  push:
    branches: [main]
    paths:
      - '.delivery/result-interpretation-v1/**'
      - 'singlecell-spatial-figures/result_interpretation/**'
      - '.github/workflows/result-interpretation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: result-interpretation-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source delivery and integrate only the interpretation module
        id: delivery
        run: |
          python - <<'PY'
          import hashlib, io, os, subprocess, sys, tarfile
          from pathlib import Path, PurePosixPath
          delivery = Path('.delivery/result-interpretation-v1')
          module = Path('singlecell-spatial-figures/result_interpretation')
          if delivery.is_dir():
              names = ['part_00.xz', 'part_01a.xz', 'part_01b.xz', 'part_02.xz', 'part_03.xz', 'part_04.xz', 'part_05.xz', 'part_06.xz']
              raw = b''.join((delivery / name).read_bytes() for name in names)
              if len(raw) != 36332 or hashlib.sha256(raw).hexdigest() != '62eedc455725c1e46dc3ae776102ce9e4fbf223b3a7947e10f5c524f19595dbb':
                  raise RuntimeError('Interpretation source-delivery checksum mismatch')
              target = Path(os.environ['RUNNER_TEMP']) / 'cns-result-interpretation-source'
              target.mkdir(exist_ok=False)
              roots = {'README.md','ROOT_README_ADDITION.md','LOCAL_TEST_REPORT.txt','apply_to_checkout.py','tests/test_installer.py'}
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
                  members = archive.getmembers()
                  if len(members) != 19 or sum(m.size for m in members) != 164961:
                      raise RuntimeError('Unexpected source inventory')
                  if len({m.name for m in members}) != len(members):
                      raise RuntimeError('Duplicate source members')
                  for member in members:
                      rel = PurePosixPath(member.name)
                      if not member.isfile() or rel.is_absolute() or '..' in rel.parts:
                          raise RuntimeError('Unsafe source member')
                      if member.name not in roots and rel.parts[:2] != ('singlecell-spatial-figures','result_interpretation'):
                          raise RuntimeError('Source path outside reviewed scope')
                      path = target / str(rel)
                      if not path.resolve().is_relative_to(target.resolve()):
                          raise RuntimeError('Escaping source path')
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
              subprocess.run([sys.executable,str(target/'apply_to_checkout.py'),'--repo',str(Path.cwd()),'--apply'],check=True)
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write('installed=true\npackage='+str(target)+'\n')
              print('Verified delivery; applied source and routing changes without altering plotting code')
          else:
              if not (module/'SKILL.md').is_file():
                  raise RuntimeError('Neither verified delivery nor installed interpretation module exists')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write('installed=false\n')
          PY
      - name: Install validator dependencies
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Run evidence and CLI regressions
        run: |
          set -o pipefail
          python -m unittest discover -s singlecell-spatial-figures/result_interpretation/tests -v 2>&1 | tee "$RUNNER_TEMP/result-tests.log"
      - name: Run non-destructive installer regressions
        if: steps.delivery.outputs.installed == 'true'
        env:
          PACKAGE_DIR: ${{ steps.delivery.outputs.package }}
        run: |
          set -o pipefail
          python -m unittest discover -s "$PACKAGE_DIR/tests" -v 2>&1 | tee "$RUNNER_TEMP/result-installer-tests.log"
      - name: Validate actual repository routes and existing research plan
        run: |
          python .github/scripts/validate_strategy_routes.py --self-test
          python singlecell-spatial-figures/research_logic/validate_research_plan.py singlecell-spatial-figures/research_logic/templates/research_plan.example.json
          python -m py_compile singlecell-spatial-figures/result_interpretation/review_results.py
      - name: Verify examples against actual source tables
        run: |
          python singlecell-spatial-figures/result_interpretation/review_results.py packet singlecell-spatial-figures/result_interpretation/examples/synthetic_multimodal.json --root singlecell-spatial-figures/result_interpretation/examples --verify-files --out "$RUNNER_TEMP/result-packet"
          python singlecell-spatial-figures/result_interpretation/review_results.py validate singlecell-spatial-figures/result_interpretation/examples/synthetic_benchmark.json --root singlecell-spatial-figures/result_interpretation/examples --verify-files
      - name: Confirm existing plotting assets are unchanged
        run: git diff --exit-code -- singlecell-spatial-figures/style_gallery singlecell-spatial-figures/assets singlecell-spatial-figures/scripts
      - name: Record checked capability boundary and update manifest
        if: steps.delivery.outputs.installed == 'true'
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, re
          from pathlib import Path
          module = Path('singlecell-spatial-figures/result_interpretation')
          evidence_log = (Path(os.environ['RUNNER_TEMP'])/'result-tests.log').read_text()
          installer_log = (Path(os.environ['RUNNER_TEMP'])/'result-installer-tests.log').read_text()
          def count(text):
              match = re.search(r'Ran (\d+) tests?', text)
              if not match or not re.search(r'^OK\s*$',text,re.M):
                  raise RuntimeError('Test report is not successful')
              return int(match.group(1))
          report = {'status':'software_checks_passed','source_commit':os.environ['GITHUB_SHA'],
                    'workflow_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                    'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
                    'evidence_cli_tests':count(evidence_log),'installer_tests':count(installer_log),
                    'real_checkout_routing':'passed','synthetic_source_bindings':'passed',
                    'scientific_review':'pending','scientific_certification':False,
                    'limits':['Synthetic regressions, not real biological validation','No native R assay execution','No automatic verification of all biological prose'],
                    'source_archive_sha256':'62eedc455725c1e46dc3ae776102ce9e4fbf223b3a7947e10f5c524f19595dbb'}
          (module/'REMOTE_VALIDATION.json').write_text(json.dumps(report,indent=2)+'\n')
          skill = Path('singlecell-spatial-figures')
          excluded = {'__pycache__','.pytest_cache','.git','.venv'}
          entries = [hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(skill).as_posix()
                     for p in sorted(skill.rglob('*')) if p.is_file() and p.name!='MANIFEST.sha256' and not (set(p.parts)&excluded)]
          (skill/'MANIFEST.sha256').write_text('\n'.join(entries)+'\n')
          PY
      - name: Publish tested source files and navigation
        if: steps.delivery.outputs.installed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md STRATEGY_ROUTES.json .github/scripts/validate_strategy_routes.py singlecell-spatial-figures/research_logic/ANALYSIS_EXECUTION.md singlecell-spatial-figures/CAPABILITIES.json singlecell-spatial-figures/MANIFEST.sha256
          find singlecell-spatial-figures/result_interpretation -type f \( -name '*.py' -o -name '*.md' -o -name '*.json' -o -name '*.csv' \) -print0 | xargs -0 git add --
          git rm -- .delivery/result-interpretation-v1/part_00.xz .delivery/result-interpretation-v1/part_01a.xz .delivery/result-interpretation-v1/part_01b.xz .delivery/result-interpretation-v1/part_02.xz .delivery/result-interpretation-v1/part_03.xz .delivery/result-interpretation-v1/part_04.xz .delivery/result-interpretation-v1/part_05.xz .delivery/result-interpretation-v1/part_06.xz
          git diff --cached --check
          git commit -m 'Publish tested source-linked result interpretation and invocation [skip ci]'
          git push origin HEAD:main
