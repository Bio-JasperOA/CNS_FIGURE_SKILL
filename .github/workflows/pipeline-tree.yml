name: Validate pipeline figure tree

on:
  push:
    branches: [main]
    paths:
      - 'singlecell-spatial-figures/pipeline_tree/**'
      - '.github/workflows/pipeline-tree.yml'
  pull_request:
    paths:
      - 'singlecell-spatial-figures/pipeline_tree/**'
      - '.github/workflows/pipeline-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/cns-pipeline-mpl
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install plotting and test dependencies
        run: |
          python -m pip install -r singlecell-spatial-figures/requirements-v3.txt -r singlecell-spatial-figures/style_gallery/requirements-tested.txt
          python -m pip install pytest
      - name: Validate registry architecture
        run: python singlecell-spatial-figures/pipeline_tree/validate_registry.py validate
      - name: Run registry and runtime regression tests
        run: python -m pytest singlecell-spatial-figures/pipeline_tree/tests -q
      - name: Render complete 36-module synthetic gallery
        run: python singlecell-spatial-figures/pipeline_tree/build_gallery.py --out /tmp/cns_pipeline_gallery
