name: Release package
on:
  push:
    branches: ['release/1.0.1']
    paths: ['.github/workflows/release-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Package tracked sources / 打包受版本管理的源文件
        run: git archive --format=zip HEAD -o /tmp/cns-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cns-release-source
          path: /tmp/cns-source.zip
          retention-days: 1
