spec_version: '2.0'
figure:
  id: Fig_atlas
  question: Which identities and states are supported by independent evidence?
  main_message: 'DRAFT: replace after reviewing the observed results.'
  evidence_level: descriptive
  width_mm: 183
  height_mm: 150
design:
  font_family: Arial
  fallback_font: DejaVu Sans
  font_pt: 7
  min_font_pt: 6
  tag_pt: 9
  line_pt: 0.6
  panel_padding_mm:
  - 9
  - 6
  - 11
  - 13
layout:
  rows: 2
  cols: 2
  row_weights:
  - 1
  - 1
  col_weights:
  - 1
  - 1
  gap_mm: 5
  margin_mm:
  - 4
  - 4
  - 4
  - 4
datasets:
  data_a:
    path: data/atlas_a.csv
    grain: cell
    keys:
    - id
    value_definition: 'DRAFT: declare the supplied numeric quantity and denominator.'
    source: 'DRAFT: replace with actual file version, assay/layer and analysis provenance.'
  data_b:
    path: data/atlas_b.csv
    grain: matrix
    keys:
    - id
    value_definition: 'DRAFT: declare the supplied numeric quantity and denominator.'
    source: 'DRAFT: replace with actual file version, assay/layer and analysis provenance.'
  data_c:
    path: data/atlas_c.csv
    grain: spot
    keys:
    - id
    value_definition: 'DRAFT: declare the supplied numeric quantity and denominator.'
    source: 'DRAFT: replace with actual file version, assay/layer and analysis provenance.'
  data_d:
    path: data/atlas_d.csv
    grain: donor_summary
    keys:
    - id
    value_definition: 'DRAFT: declare the supplied numeric quantity and denominator.'
    source: 'DRAFT: replace with actual file version, assay/layer and analysis provenance.'
scales:
  identity:
    kind: categorical
    order:
    - Population_A
    - Population_B
    colors:
      Population_A: '#4477AA'
      Population_B: '#CC6677'
    label: Population
  expression:
    kind: continuous
    limits:
    - 0
    - 4
    label: 'DRAFT: log-normalized expression'
    cmap: viridis
panels:
- id: a
  question: Which identities are resolved?
  role: identity
  renderer: embedding
  data_id: data_a
  slot:
  - 0
  - 0
  - 1
  - 1
  channels:
    x: x
    y: y
    category: cell_type
  scale_ids:
    category: identity
  depends_on: []
  statistics:
    inferential: false
    independent_unit: none
    n_biological: 0
    method: Descriptive plan; no hypothesis test is claimed.
- id: b
  question: Do reviewed markers support the labels?
  role: validation
  renderer: marker_dot
  data_id: data_b
  slot:
  - 0
  - 1
  - 1
  - 1
  channels:
    x: gene
    y: group
    color: mean_expression
    size: fraction_detected
  scale_ids:
    color: expression
  depends_on:
  - a
  statistics:
    inferential: false
    independent_unit: none
    n_biological: 0
    method: Descriptive plan; no hypothesis test is claimed.
- id: c
  question: Where are the identities located?
  role: spatial_context
  renderer: spatial
  data_id: data_c
  slot:
  - 1
  - 0
  - 1
  - 1
  channels:
    x: x
    y: y
    color: expression
  scale_ids:
    color: expression
  depends_on:
  - a
  statistics:
    inferential: false
    independent_unit: none
    n_biological: 0
    method: Descriptive plan; no hypothesis test is claimed.
  spatial:
    unit: um
    y_axis_down: true
    section_column: section_id
    transform_applied: 'DRAFT: document calibration and applied affine transform.'
- id: d
  question: How variable is composition across biological samples?
  role: quantification
  renderer: sample_composition
  data_id: data_d
  slot:
  - 1
  - 1
  - 1
  - 1
  channels: {}
  scale_ids: {}
  depends_on:
  - a
  statistics:
    inferential: false
    independent_unit: none
    n_biological: 0
    method: Descriptive plan; no hypothesis test is claimed.
